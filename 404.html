<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Java HTTP Server</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="background-glow"></div>
    <div class="container" style="text-align: center;">
        <div class="card" style="max-width: 500px; margin: 60px auto;">
            <h1 style="font-size: 5rem; line-height: 1;">404</h1>
            <h2 style="justify-content: center; margin-bottom: 12px;">Page Not Found</h2>
            <p style="color: var(--muted); margin-bottom: 24px;">The requested resource could not be found on this server.</p>
            <a href="/" class="btn" style="display: inline-block; text-decoration: none; width: auto; padding: 10px 24px;">Return Home</a>
        </div>
    </div>
</body>
</html>
